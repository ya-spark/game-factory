# Registry of games produced by the factory. One entry per game, e.g.:
#   - id: block-puzzle
#     repo: ya-spark/game-block-puzzle
#     package: com.yaspark.blockpuzzle
#     status: draft   # draft | internal | closed-test | production
apps:
  - id: block_puzzle
    repo: ya-spark/game-block-puzzle
    package: com.activemindcraft.blockpuzzle
    status: draft
  - id: blockfall
    repo: ya-spark/game-block-fall
    package: com.activemindcraft.blockfall
    status: draft
  - id: wingy
    repo: ya-spark/game-wingy
    package: com.activemindcraft.wingy
    status: draft
