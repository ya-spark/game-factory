# Registry of games produced by the factory. One entry per game, e.g.:
#   - id: block-puzzle
#     repo: ya-spark/game-block-puzzle
#     package: com.yaspark.blockpuzzle
#     status: draft   # draft | internal | closed-test | production
apps:
  - id: block_puzzle
    repo: ya-spark/game-block-puzzle
    package: com.activemindcraft.blockpuzzle
    status: draft
  - id: blockfall
    repo: ya-spark/game-block-fall
    package: com.activemindcraft.blockfall
    status: draft
  - id: wingy
    repo: ya-spark/game-wingy
    package: com.activemindcraft.wingy
    status: draft
  # NOTE (owner, 2026-11-15): the repo names follow the AUDIENCE (preteen = Scout, Years 0-6; lowteen = Ranger,
  # Years 7-10); the app ids craft_lowteen and craft_preteen are historical and stay as they are in the code.
  - id: craft_lowteen          # Craft Scout
    repo: ya-spark/game-craft-preteen
    package: com.activemindcraft.craftscout
    status: draft
  - id: craft_preteen          # Craft Ranger
    repo: ya-spark/game-craft-lowteen
    package: com.activemindcraft.craftranger
    status: draft
  - id: craft_highteen
    repo: ya-spark/game-craft_highteen
    package: com.activemindcraft.craftchampion
    status: draft
  - id: mind_1
    repo: ya-spark/game-mind-1
    package: com.activemindcraft.mindember
    status: draft
  - id: mind_9
    repo: ya-spark/game-mind-9
    package: com.activemindcraft.mindpresto
    status: draft
