# Work queue for the hourly factory-runner (a scheduled Claude task).
# Each run: read this file, do the FIRST step whose status is `pending` (or finish an
# `in_progress` one), update its status in a PR to app-factory, merge that PR when CI is green.
# Statuses: pending | in_progress | done | blocked (blocked needs a human; say why in `note`).
#
# Guardrails (the runner must never, without the user asking in a conversation):
#   - publish to Google Play, enable real ads / IAP, spend money
#   - create, read, print or commit secrets (keystores, service accounts, real AdMob IDs in debug)
#   - push directly to `main` (always branch + PR; merge only when CI is green)
#   - create GitHub repos in ya-spark (the integration gets 403: ask the user to create them)
# Add new steps at the bottom. One step per run is fine.

steps:
  - id: merge-restyle
    what: Merge app-factory PR #3 (restyle) once template-ci is green.
    status: done
    note: "Merged as a024396."

  - id: push-block-puzzle
    what: >
      Generate Block Puzzle from the template with scripts/new_game.py
      (--id block_puzzle --name "Block Puzzle" --package com.activemindcraft.blockpuzzle),
      push it to a branch `initial-game` of ya-spark/game-block-puzzle (repo already exists,
      private), open a PR, merge when its CI (`check` job) is green.
    status: done
    note: "Merged (game-block-puzzle PR #1). Optional emulator job could not boot an emulator on the runner."

  - id: register-block-puzzle
    what: >
      In app-factory add the game to registry/apps.yaml
      (id block_puzzle, package com.activemindcraft.blockpuzzle,
      repo ya-spark/game-block-puzzle, status draft) via PR; merge when green.
    status: done
    note: "Registered in the same PR that updated this file."

  - id: emulator-manual-only
    what: >
      The emulator integration job never booted on GitHub-hosted runners and wastes ~12 min per
      PR. Make it run only on workflow_dispatch in template-ci.yml (app-factory) and in the
      template's .github/workflows/ci.yml, and apply the same ci.yml change to
      ya-spark/game-block-puzzle (separate PR there). Keep it honest: do not fake the test.
    status: done
    note: "Merged: app-factory PR #5 and game-block-puzzle PR #2."

  - id: stage-agents
    what: >
      Build the nine stage subagents (.claude/agents), the /new-app orchestrator skill and
      per-game stage tracking (scripts/pipeline.py, registry/games/<id>.json). The hourly
      runner then uses `pipeline.py next` for per-game work.
    status: done
    note: ""

  - id: master-repo
    what: >
      Set up ya-spark/game-studio as the master repo with app-factory and every game as
      submodules, plus a weekly bump workflow.
    status: done
    note: "Merged (game-studio PR #1). Pins: app-factory, game-block-puzzle. Add game-block-fall after its first PR merges. The bump workflow needs the STUDIO_SUBMODULE_TOKEN secret from the user."

  - id: issue-inbox
    what: >
      GitHub issue forms (new game, change request) as the inbox; the hourly runner and the
      /new-app skill turn issues into the full flow (docs/INBOX.md).
    status: done
    note: "Built in the issue-inbox PR. Untested end to end until the first real issue."
