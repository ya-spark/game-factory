# Copy to .github/workflows/web-vps.yml in the game repo (the studio session installs it: the
# Claude token cannot push .github/workflows). Hostinger VPS web copy of the Android game, see
# game-studio docs/WEB-VPS.md. Started by hand only.
#
# Set VPS_APP_FOLDER below for this game: scout, ranger, champion, ember or presto.
# Repo secrets (never in a file): VPS_SSH_KEY, VPS_SSH_HOST, VPS_SSH_USER, VPS_SSH_KNOWN_HOSTS.
name: web-vps

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build but do not upload"
        type: boolean
        default: false
      content_base_url:
        description: "Content base URL override (empty = the one in app.config.yaml)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: web-vps
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.8"
  VPS_APP_FOLDER: "CHANGE_ME" # scout | ranger | champion | ember | presto

jobs:
  web-vps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the folder name
        run: |
          case "$VPS_APP_FOLDER" in
            scout|ranger|champion|ember|presto) ;;
            *) echo "Set VPS_APP_FOLDER in the workflow to scout, ranger, champion, ember or presto"; exit 1 ;;
          esac

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Build the web release
        env:
          CONTENT_BASE_URL: ${{ inputs.content_base_url }}
        run: |
          if [ -n "$CONTENT_BASE_URL" ]; then
            flutter build web --release --base-href "/$VPS_APP_FOLDER/" --dart-define=CONTENT_BASE_URL="$CONTENT_BASE_URL"
          else
            flutter build web --release --base-href "/$VPS_APP_FOLDER/"
          fi

      - name: Upload over SSH
        if: ${{ !inputs.dry_run }}
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          SSH_USER: ${{ secrets.VPS_SSH_USER }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          [ -n "$SSH_KEY" ] && [ -n "$SSH_HOST" ] && [ -n "$SSH_USER" ] && [ -n "$SSH_KNOWN_HOSTS" ] || { echo "SSH secrets are not set"; exit 1; }
          umask 077
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/web_vps_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          SSH="ssh -i $HOME/.ssh/web_vps_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          # The key is restricted on the server (rrsync, write-only) to the web root, so the remote
          # path is relative to it. The entry file goes last: visitors never see an index.html that
          # names files which are not there yet.
          rsync -az --delete --exclude 'index.html' -e "$SSH" build/web/ "$SSH_USER@$SSH_HOST:$VPS_APP_FOLDER/"
          rsync -az -e "$SSH" build/web/index.html "$SSH_USER@$SSH_HOST:$VPS_APP_FOLDER/index.html"
          echo "uploaded $VPS_APP_FOLDER"
          rm -f ~/.ssh/web_vps_key
