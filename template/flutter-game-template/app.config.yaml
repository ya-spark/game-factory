# Per-game configuration. The factory's repo agent fills in the PLACEHOLDER values.
# Read by: lib/core/config/app_config.dart (runtime), android/app/build.gradle.kts (build),
#          scripts/ad_safety_check.sh (CI).
app:
  id: block_puzzle
  display_name: Block Puzzle
  package_name: com.example.blockpuzzle # PLACEHOLDER: set per game before first Play upload

# Compliance profile (issue 1C2): child (Scout, Ranger), teen (Champion) or adult (Mind, and the
# plain puzzle template). It sets ads, sign-in and the parent gate; scripts/profile_check.sh
# rejects unsafe combinations. See docs/ENGINE.md.
audience: adult # child | teen | adult

# Reading aloud (Quick quiz): auto_read reads each question on its own (Scout's younger level).
speech:
  auto_read: false
  locale: en-AU

theme:
  seed_color: "#2EC4B6"
  dark: true
  # design: craft_lowteen # design app id; set by new_game.py for the five apps (assets/design/)

# Per-platform switches. Only Android is built in v1; iOS/web keep the same Dart code.
platforms:
  android:
    enabled: true
  ios:
    enabled: false
  web:
    enabled: false

# AdMob. debug.* MUST be Google's sample IDs; release.* MUST NOT be sample IDs.
# scripts/ad_safety_check.sh enforces both in CI.
admob:
  debug:
    app_id: ca-app-pub-3940256099942544~3347511713
    banner: ca-app-pub-3940256099942544/6300978111
    interstitial: ca-app-pub-3940256099942544/1033173712
    rewarded: ca-app-pub-3940256099942544/5224354917
  release:
    app_id: PLACEHOLDER_ADMOB_APP_ID # ca-app-pub-XXXXXXXXXXXXXXXX~YYYYYYYYYY
    banner: PLACEHOLDER_ADMOB_BANNER_ID
    interstitial: PLACEHOLDER_ADMOB_INTERSTITIAL_ID
    rewarded: PLACEHOLDER_ADMOB_REWARDED_ID

# Ad pacing (see lib/core/ads/ad_frequency.dart).
ads:
  interstitial_min_interval_seconds: 90
  interstitial_every_n_game_overs: 2
  max_interstitials_per_session: 6
  no_interstitial_first_seconds: 60
  banner_enabled: true # banner only before and after a game (menu, pre_game, post_game), never in play
  interstitials_enabled: false # must stay false in every profile
  rewarded_enabled: true # adult only (the Continue); child and teen must not set it
  # Child-directed ad treatment (COPPA / under-age-of-consent) and max ad content rating (G, PG, T, MA).
  # child and teen: child_directed true; child max G, teen max PG. adult: child_directed false.
  child_directed: false
  max_ad_content_rating: PG

# Sharing through the system share sheet. link_mode: internal_test (link to the internal test
# page), store (Play Store page of package_name) or off (no link, "Share app" hidden). An empty
# internal_test_url behaves like off. The owner switches to store when the game is public.
share:
  link_mode: internal_test   # internal_test | store | off
  internal_test_url: ""

# Retention features, all ON by default.
retention:
  daily_reward: true
  streaks: true
  daily_challenges: true
  achievements: true
  game_challenges: false # hubs set true: daily challenges are game-based (score, different games, streak)

# Google Play Games Services: sign-in, leaderboard, cloud save. Off = local only.
# Setup steps: game-factory docs/PLAY_GAMES_SETUP.md. IDs are public, not secrets.
play_games:
  enabled: false
  app_id: PLACEHOLDER_PLAY_GAMES_APP_ID
  leaderboard_high_score: PLACEHOLDER_LEADERBOARD_ID

# Other games by the studio, shown on the "More games" screen (Settings row and small Home icon).
# Bundled: no network call. status: live (card with "Get it") | coming_soon (card, no button) |
# hidden (not listed). This game's own package_name is skipped, so the same list is copied to
# every game. The owner flips an entry to live when that game is public. If nothing is listed,
# the Settings row and the Home icon are not shown. Synced by `scripts/pipeline.py more-games`.
more_games:
  - id: blockpuzzle
    package_name: com.activemindcraft.blockpuzzle
    name: "Block Puzzle"
    tagline: "Drag, fit and clear the board"
    status: hidden
  - id: blockfall
    package_name: com.activemindcraft.blockfall
    name: "Blockfall"
    tagline: "Stack gems and clear rows"
    status: hidden
  - id: wingy
    package_name: com.activemindcraft.wingy
    name: "Wingy"
    tagline: "Tap to flap through the canyon"
    status: hidden

# Learning content (issue 1B). One fixed HTTPS host, static files only, no personal data sent.
# Signing is optional until the owner adds a key: while signing_public_key starts with PLACEHOLDER
# an unsigned index is accepted (the build prints a warning). With a real key every index must carry
# a valid Ed25519 signature, and the app never goes back to unsigned.
content:
  enabled: false # learning games set true: child profiles, picker on every launch, parent area
  base_url: https://content.activemindcraft.com/v1/
  signing_public_key: PLACEHOLDER_SIGNING_PUBLIC_KEY # base64 Ed25519 public key
  signing_key_id: PLACEHOLDER_SIGNING_KEY_ID
  mobile_confirm_mb: 20 # above this, a full pack on mobile data asks the parent first
  daily_release:
    initial_per_subject: 10
    per_day_per_subject: 2
    require_passed: true

# Rewards for learning games (issue 1C1). Craft apps: stars are progress and never spent; coins are
# a small earned trickle capped per child per week. Mind hubs set stars.enabled: false.
rewards:
  stars:
    enabled: true
    per_first_pass: 1
    topic_bonus: 5
    streak_bonus: 2 # once a day, on a streak of 2 days or more
  coins:
    weekly_cap_per_child: 60
    topic: 10
    streak_milestones: {3: 10, 7: 15, 14: 20, 30: 30} # each pays once
    daily_goal_items: 5
    daily_goal: 5
    weekly_goal_items: 25
    weekly_goal: 15
    new_questions_goal: 3 # pass N new questions today
    new_questions: 5
    new_topic: 5 # first session in a topic today
    revise_goal: 3 # put N earlier mistakes right today
    revise: 5

# Minigames: price of a coin-locked game (200 in Craft apps, 300 in Mind hubs).
minigames:
  coin_price: 200

# AI tutor hook. No AI feature ships; keep false.
ai:
  enabled: false
