# SHARED pipeline: analyze, format, tests and the safety scripts for one game repo.
# Called by each game repo's .github/workflows/check-code.yml (the repo decides when it runs and
# whether CI_ENABLED switches it on). Fix a check here once; every game picks it up on its next run.
# The game repo's root is the Flutter project, and the scripts/ it runs live in the game repo.
# A check that needs a script (engine lock, profile, network, naming) runs only when the game has that script,
# so the same workflow serves every game, old and new.
name: shared-check-code

on:
  workflow_call:
    inputs:
      emulator_test:
        description: Also run the optional Android emulator integration test (needs KVM, often fails on GitHub runners)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    name: analyze, format, tests, safety checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the Flutter pin (game-factory/.flutter-version)
        id: flutter
        shell: bash
        run: |
          version=$(curl -fsSL https://raw.githubusercontent.com/ya-spark/game-factory/main/.flutter-version | tr -d '[:space:]')
          [ -n "$version" ] || { echo "::error::could not read the Flutter pin"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format check
        run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - name: Engine lock (the engine files match engine.lock; change them in game-factory)
        if: ${{ hashFiles('scripts/engine_lock.py') != '' }}
        run: python3 scripts/engine_lock.py check
      - name: Ad safety (no real ad IDs in debug, no test IDs in release)
        run: bash scripts/ad_safety_check.sh
      - name: Profile check (audience rules)
        if: ${{ hashFiles('scripts/profile_check.sh') != '' }}
        run: bash scripts/profile_check.sh
      - name: Profile check self-test (script must fail on violations)
        if: ${{ hashFiles('scripts/test_profile_check.sh') != '' }}
        run: bash scripts/test_profile_check.sh
      - name: Network rules (INTERNET, no cleartext, https host; warns while signing is off)
        if: ${{ hashFiles('scripts/network_safety_check.sh') != '' }}
        run: bash scripts/network_safety_check.sh
      - name: Naming rule (no trademarked names)
        if: ${{ hashFiles('scripts/naming_check.sh') != '' }}
        run: bash scripts/naming_check.sh
      - name: Assets license check
        run: bash scripts/check_asset_licenses.sh
      - name: No secrets committed
        run: bash scripts/no_secrets_check.sh
      - name: Play promote script tests
        run: python3 scripts/test_play_promote.py
      - name: Play status script tests
        run: python3 scripts/test_play_status.py

  # OPTIONAL, manual only (Actions tab -> check-code -> Run workflow, tick emulator_test). The Android emulator needs
  # hardware acceleration (KVM). On GitHub-hosted runners it did not boot in our first run
  # ("Timeout waiting for emulator to boot"), so it no longer runs on every PR. Run the
  # integration test on a real device or a local emulator, or use a runner with KVM.
  emulator-integration-test:
    name: emulator integration test (optional)
    if: ${{ inputs.emulator_test }}
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Read the Flutter pin (game-factory/.flutter-version)
        id: flutter
        shell: bash
        run: |
          version=$(curl -fsSL https://raw.githubusercontent.com/ya-spark/game-factory/main/.flutter-version | tr -d '[:space:]')
          [ -n "$version" ] || { echo "::error::could not read the Flutter pin"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run integration tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: flutter test integration_test
