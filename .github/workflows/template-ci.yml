name: template-ci

on:
  # CI is controlled by the repository variable CI_ENABLED (Settings, Secrets and variables, Actions, Variables):
  # off (not 'true') = pushes and pull requests run nothing; on = every push runs all steps. A run started
  # by hand (Run workflow) always runs. Currently OFF (owner, 2026-11-11: finish the coding first, same rule as
  # the generated game repos). Docs-only changes (markdown at the root, docs/, store/) never run CI.
  pull_request:
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'template/*/*.md'
      - 'template/*/docs/**'
      - 'template/*/store/**'
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'template/*/*.md'
      - 'template/*/docs/**'
      - 'template/*/store/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.8"

jobs:
  template:
    # Required check: analyze, format, tests, safety scripts, debug APK build.
    if: ${{ vars.CI_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: template/flutter-game-template
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: No secrets committed
        run: bash scripts/no_secrets_check.sh
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - name: Ad safety check
        run: bash scripts/ad_safety_check.sh
      - name: Ad safety self-test (script must fail on violations)
        run: bash scripts/test_ad_safety_check.sh
      - name: Engine lock
        run: python3 scripts/engine_lock.py check
      - name: Profile check (audience rules)
        run: bash scripts/profile_check.sh
      - name: Profile check self-test (script must fail on violations)
        run: bash scripts/test_profile_check.sh
      - name: Network rules (INTERNET, no cleartext, https host; warns while signing is off)
        run: bash scripts/network_safety_check.sh
      - name: Assets license check
        run: bash scripts/check_asset_licenses.sh
      - name: Release workflow stops on missing secrets
        run: |
          grep -q 'Missing secret' .github/workflows/release.yml
          for s in PLAY_SERVICE_ACCOUNT_JSON ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            grep -q "$s" .github/workflows/release.yml
          done
      - name: Debug APK builds
        run: flutter build apk --debug

  # Proves the generator output is a working project: unit tests, then generate a sample game
  # and run the same gates (including a debug APK build) inside it.
  generator:
    if: ${{ vars.CI_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { profile: puzzle, audience: adult, id: sample_puzzle }
          - { profile: craft, audience: child, id: sample_craft_child }
          - { profile: craft, audience: teen, id: sample_craft_teen }
          - { profile: mind, audience: adult, id: sample_mind }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generator unit tests
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Generate sample game
        run: |
          python3 scripts/new_game.py --id ${{ matrix.id }} --name "Sample Game" \
            --package com.yaspark.${{ matrix.id }} --seed-color "#3366CC" \
            --profile ${{ matrix.profile }} --audience ${{ matrix.audience }} \
            --out "$RUNNER_TEMP/sample_game"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: flutter pub get
        working-directory: ${{ runner.temp }}/sample_game
        run: flutter pub get
      - name: Format
        working-directory: ${{ runner.temp }}/sample_game
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        working-directory: ${{ runner.temp }}/sample_game
        run: flutter analyze
      - name: Tests
        working-directory: ${{ runner.temp }}/sample_game
        run: flutter test
      - name: Ad safety check
        working-directory: ${{ runner.temp }}/sample_game
        run: bash scripts/ad_safety_check.sh
      - name: Profile check
        working-directory: ${{ runner.temp }}/sample_game
        run: bash scripts/profile_check.sh
      - name: Engine lock
        working-directory: ${{ runner.temp }}/sample_game
        run: python3 scripts/engine_lock.py check
      - name: Assets license check
        working-directory: ${{ runner.temp }}/sample_game
        run: bash scripts/check_asset_licenses.sh
      # The runner downloads the Android NDK on every run and that download is sometimes cut short
      # ("Error reading Zip content"). Install the NDK Flutter asks for in its own step and retry
      # only that, so Gradle finds it and a real build error is not retried.
      - name: Install the Android NDK (retried)
        shell: bash
        run: |
          ndk=$(grep -oP 'val ndkVersion: String = "\K[^"]+' \
            "$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt")
          [ -n "$ndk" ] || { echo "::error::could not read the NDK version from Flutter"; exit 1; }
          echo "NDK $ndk"
          for attempt in 1 2 3; do
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ndk" && exit 0
            echo "::warning title=NDK install failed::attempt ${attempt} of 3 failed"
            sleep 15
          done
          exit 1
      - name: Debug APK builds
        working-directory: ${{ runner.temp }}/sample_game
        run: flutter build apk --debug

  # Optional, manual only (workflow_dispatch). Runs the template's integration_test bot on an
  # Android emulator. Non-blocking: needs KVM on the hosted runner.
  emulator:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 40
    defaults:
      run:
        working-directory: template/flutter-game-template
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          working-directory: template/flutter-game-template
          script: flutter test integration_test -d emulator-5554 --reporter expanded
