name: game_blockfall
description: "Blockfall: one of the games in game-factory/games; apps and the web are containers that show it."
publish_to: 'none'
version: 1.0.0
environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.38.2
  # Shared narrator voice and ambience live in game_core's assets; resolved by the container's
  # dependency_overrides (git ref of game-factory). In this repo, pubspec_overrides.yaml points at ../../game_core.
  game_core: ^1.0.0
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
