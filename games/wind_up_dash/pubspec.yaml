name: game_wind_up_dash
description: "Wind-up dash: a Mind hub game in game-factory/games; the hubs are containers that list it."
publish_to: 'none'
version: 1.0.0
environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  # Resolved by the container's dependency_overrides (git ref of game-factory). In this repo,
  # pubspec_overrides.yaml points it at ../../game_core.
  game_core: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
