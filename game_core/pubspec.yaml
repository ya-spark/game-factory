name: game_core
description: "Shared foundation of every game: the content and quiz engine (pure Dart). Games live in ../games/<game>, apps and the web are containers that use them."
publish_to: 'none'
version: 1.0.0
environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  yaml: ^3.1.4
  shared_preferences: ^2.5.6  # the arcade frame keeps its best score
  audioplayers: ^6.1.0  # imported only in lib/kit/audio/audioplayers_audio_service.dart
  crypto: ^3.0.8
  cryptography: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

executables:
  content_cli:

flutter:
  assets:
    - assets/audio/voice/
    - assets/audio/ambience/
